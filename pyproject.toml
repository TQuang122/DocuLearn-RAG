[project]
name = "doculearn-rag"
version = "0.1.0"
description = "A local PDF-grounded learning assistant with Q&A, summaries, quizzes, and flashcards."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "datasets>=5.0.0",
    "fastapi>=0.139.2",
    "google-genai>=1.0.0",
    "gradio>=6.20.0",
    "langchain-community==0.3.31",
    "langchain-google-genai>=4.3.1",
    "langchain-qdrant>=1.1.0",
    "langchain-text-splitters>=1.0.0",
    "loguru>=0.7.3",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.0.0",
    "pypdf>=6.14.2",
    "python-multipart>=0.0.20",
    "qdrant-client>=1.18.0",
    "ragas==0.3.9",
    "sentence-transformers>=5.6.0",
    "typer>=0.21.0",
    "uvicorn>=0.42.0",
]

[project.scripts]
doculearn-rag = "src.interfaces.cli:app"
notebooklm = "src.interfaces.cli:app"

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.setuptools]
py-modules = ["app"]

[tool.uv]
package = true

[dependency-groups]
dev = [
    "basedpyright>=1.29.0",
    "httpx>=0.28.0",
    "pytest>=9.0.0",
    "pytest-cov>=7.0.0",
    "ruff>=0.14.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-config", "--strict-markers"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.basedpyright]
include = ["src", "app.py"]
exclude = ["tests", ".venv", "data", "storage", "exports"]
